<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>MACACA 吊牌掃描回報</title>
<style>
/* 版面：單欄手機工具。上：店名／月份；中：大拍照鈕＋清單；下：固定合計列＋產生鈕 */
:root { --bg:#f5f6f4; --panel:#ffffff; --ink:#1c2326; --ink2:#5c6670; --line:#dde2e0; --accent:#1f6f5f; --accent-ink:#ffffff; --soft:#e6f1ee; --warn:#9a5b00; --warnbg:#fff4df; --bad:#b1301f; --badbg:#fde9e6; --ret:#7a4b9c; --retbg:#f1e8f8; --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"SF Mono",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121716; --panel:#1b2221; --ink:#eef2f0; --ink2:#9aa6a2; --line:#2e3836; --accent:#5fc3ad; --accent-ink:#0d1a17; --soft:#1e2f2b; --warn:#f0b35a; --warnbg:#3a2c12; --bad:#ff8a78; --badbg:#3d1c17; --ret:#c9a4e8; --retbg:#2d2238; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#121716; --panel:#1b2221; --ink:#eef2f0; --ink2:#9aa6a2; --line:#2e3836; --accent:#5fc3ad; --accent-ink:#0d1a17; --soft:#1e2f2b; --warn:#f0b35a; --warnbg:#3a2c12; --bad:#ff8a78; --badbg:#3d1c17; --ret:#c9a4e8; --retbg:#2d2238; color-scheme:dark }
body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5; }
.wrap { max-width:640px; margin:0 auto; padding-inline:16px; padding-block:14px 150px; }
h1 { font-size:20px; margin:0; letter-spacing:.01em; }
.lede { color:var(--ink2); font-size:13px; margin:2px 0 12px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label.f { display:block; font-size:12px; color:var(--ink2); margin-bottom:4px; letter-spacing:.04em; }
input[type=text], input[type=month] { width:100%; font:inherit; font-size:17px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); min-width:0; }
input:focus { outline:2px solid var(--accent); outline-offset:1px; }
.btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-size:17px; font-weight:700; padding:14px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; min-height:56px; }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); grid-column:1 / -1; font-size:19px; min-height:64px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.manual { display:flex; gap:8px; margin-top:10px; }
.manual input { flex:1; text-transform:uppercase; font-family:var(--mono); }
.manual .btn { min-height:44px; padding:8px 14px; font-size:15px; }
.status { font-size:14px; padding:10px 12px; border-radius:10px; margin-top:10px; }
.status.ok { background:var(--soft); color:var(--ink); }
.status.warn { background:var(--warnbg); color:var(--warn); }
.status.bad { background:var(--badbg); color:var(--bad); }
.status.busy { background:var(--soft); color:var(--ink2); }
.hint { font-size:12.5px; color:var(--ink2); margin-top:8px; }
.list { list-style:none; margin:0; padding:0; }
.item { display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.item:first-child { border-top:0; }
.sku { font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:.02em; }
.name { font-size:13px; color:var(--ink2); min-width:0; overflow-wrap:anywhere; }
.name .price { font-variant-numeric:tabular-nums; }
.flag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; margin-left:6px; vertical-align:1px; }
.flag.bad { background:var(--badbg); color:var(--bad); }
.flag.ret { background:var(--retbg); color:var(--ret); }
.ctl { display:flex; align-items:center; gap:6px; }
.ctl button { font:inherit; font-size:20px; width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.ctl .qty { min-width:34px; text-align:center; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.ctl .mini { font-size:12px; width:auto; padding:0 10px; height:34px; color:var(--ink2); }
.ctl .mini.on { background:var(--retbg); color:var(--ret); border-color:var(--ret); }
.ctl .del { color:var(--bad); }
.sub-ctl { grid-column:1 / -1; display:flex; justify-content:flex-end; gap:6px; }
.empty { color:var(--ink2); font-size:14px; padding:14px 0; text-align:center; }
.foot { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.foot .in { max-width:640px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
.tot { font-size:14px; color:var(--ink2); }
.tot b { font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums; }
.tot .r { color:var(--ret); }
.foot .btn.pri { grid-column:auto; min-height:52px; font-size:17px; padding:10px 18px; }
.foot .after { grid-column:1 / -1; font-size:13px; }
.again { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.again .mini { font:inherit; font-size:14px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.again .mini.danger { color:var(--bad); }
.ph-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.ph-head .hint { margin:0; }
.photos { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.photo { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg); }
.photo img { display:block; width:100%; height:110px; object-fit:cover; cursor:pointer; }
.photo .pb { padding:6px 8px; font-size:12.5px; color:var(--ink2); display:flex; justify-content:space-between; align-items:center; gap:6px; }
.photo .pb b { color:var(--ink); }
.photo .pb button { font:inherit; font-size:12px; padding:3px 8px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--bad); cursor:pointer; }
.photo .codes { display:none; padding:0 8px 8px; flex-wrap:wrap; gap:5px; }
.photo.open .codes { display:flex; }
.photo .codes .chip { display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:12.5px; padding:3px 6px 3px 8px; border-radius:999px; background:var(--soft); color:var(--ink); }
.photo .codes .chip.ocr { background:var(--warnbg); color:var(--warn); }
.photo .codes .chip.none { background:var(--badbg); color:var(--bad); font-family:var(--font); }
.photo .codes .chip button { font:inherit; font-size:14px; line-height:1; border:0; background:transparent; color:inherit; cursor:pointer; padding:0 2px; }
.src { font-size:11px; color:var(--ink2); margin-left:4px; }
.thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.thumbs img { height:56px; width:auto; max-width:100%; border-radius:6px; border:1px solid var(--line); }
input[type=file] { display:none; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform:scale(.98); } }
</style>
<div class="wrap">
  <h1>MACACA 吊牌掃描回報</h1>
  <p class="lede">拍吊牌條碼 → 自動列出貨號、尺寸、件數 → 產生經銷銷售回報表（Excel）</p>

  <div class="panel">
    <div class="row2">
      <div><label class="f" for="store">店名</label><input type="text" id="store" placeholder="例：次世代運動" autocomplete="organization"></div>
      <div><label class="f" for="month">結算月份</label><input type="month" id="month"></div>
    </div>
  </div>

  <div class="panel">
    <div class="btns">
      <label class="btn pri" for="shot">📷 拍吊牌（可一次拍好幾張）<input type="file" id="shot" accept="image/*" capture="environment" multiple></label>
      <label class="btn" for="pick">🖼 從相簿選<input type="file" id="pick" accept="image/*" multiple></label>
      <button class="btn" id="btnManual" type="button">⌨ 打貨號</button>
    </div>
    <form class="manual" id="manualForm" hidden><input type="text" id="manual" placeholder="貨號-尺寸，例 EZG1872-S" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn" type="submit">加入</button></form>
    <div class="status" id="status" hidden></div>
    <p class="hint">每張吊牌同時讀<b>條碼</b>和印在上面的<b>款號文字</b>，兩個互相補；一張吊牌＝賣出 1 件。同款多件請每張都拍，或在清單按「＋」。拍近一點、避免反光。退貨請在清單上按「退貨」。</p>
  </div>

  <div class="panel" id="photosPanel" hidden>
    <div class="ph-head"><b>拍過的照片</b><span class="hint" id="phHint">點照片可以看讀到哪些款；刪照片會一起扣掉它讀到的件數</span></div>
    <ul class="photos" id="photos"></ul>
  </div>

  <div class="panel">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">還沒有品項。拍第一張吊牌吧。</div>
  </div>
</div>
<div class="foot"><div class="in">
  <div class="tot" id="tot">賣出 <b>0</b> 件</div>
  <button class="btn pri" id="btnXlsx" type="button" disabled>產生 Excel</button>
  <div class="after" id="after" hidden></div>
</div></div>

        return navigator.share({ files: [file], title: name }).then(function () { return 'shared'; }).catch(function () { return dlLink(blob, name); });
      }
    } catch (e) {}
    return Promise.resolve(dlLink(blob, name));
  }
  function dlLink(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); }, 2000); return 'link';
  }
  $('btnXlsx').addEventListener('click', makeXlsx);

  /* ---------- 啟動 ---------- */
  load();
  $('store').value = S.store || ''; $('month').value = S.month || thisMonth();
  $('store').addEventListener('change', function () { S.store = this.value.trim(); save(); });
  $('month').addEventListener('change', function () { S.month = this.value; save(); });
  render();
  window.__TAG = S;
})();
